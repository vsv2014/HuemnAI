version: '3.8'
services:
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: huemn
      POSTGRES_PASSWORD: huemn
      POSTGRES_DB: huemn
    ports:
      - "5432:5432"
  app:
    build: ./
    working_dir: /app/ai/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://huemn:huemn@postgres:5432/huemn
      REDIS_URL: redis://redis:6379/0
      SENTRY_DSN: ""
    depends_on:
      - redis
      - postgres
  worker:
    build: ./
    working_dir: /app/ai/backend
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: postgresql+psycopg2://huemn:huemn@postgres:5432/huemn
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - postgres
