apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: huemn
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: huemn/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_BASE
              value: "http://backend.huemn.svc.cluster.local:8000/api"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: huemn
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: frontend
