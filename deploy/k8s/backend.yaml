apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: huemn
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: huemn/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: REDIS_URL
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: huemn
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: backend
