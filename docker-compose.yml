version: '3.8'

services:
  nginx:
    build: ./nginx
    container_name: huemn-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: always
    networks:
      - huemn-network

  backend:
    build: ./ai/backend
    container_name: huemn-backend
    # Expose port only to other containers (Nginx)
    expose:
      - "8000"
    # Env vars
    env_file:
      - .env
    environment:
      - ENV=production
      - SECRET_KEY=${SECRET_KEY:?Set a strong, random SECRET_KEY of at least 32 characters}
      - BYPASS_SUBSCRIPTION=0
    restart: always
    networks:
      - huemn-network

  frontend:
    build:
      context: ./ai/frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost/api}
    container_name: huemn-frontend
    # Expose port only to other containers
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost/api
      # Internal API URL for SSR (Server Side Rendering) to reach backend
      # Since SSR runs inside container, it needs to reach backend container name
      - API_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend
    restart: always
    networks:
      - huemn-network

networks:
  huemn-network:
    driver: bridge