name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Static checks
        run: |
          python -m py_compile $(git ls-files '*.py')
      - name: Embedding regression tests
        run: python -m unittest discover -s tests -p 'test_embedding_similarity.py'
      - name: Embedding provenance regression tests
        run: python -m unittest discover -s tests -p 'test_embedding_provenance.py'
      - name: Build Docker image
        run: |
          docker build -t huemn-backend:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install deps
        run: npm ci
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost/api
        run: npm run build
      - name: Build Docker image
        run: |
          docker build -t huemn-frontend:ci .
