name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Static checks
        run: |
          python -m py_compile $(git ls-files '*.py')
      - name: Embedding regression tests
        run: python -m unittest discover -s tests -p 'test_embedding_similarity.py'
      - name: Embedding provenance regression tests
        run: python -m unittest discover -s tests -p 'test_embedding_provenance.py'
      - name: Bounded RAG chunking regression tests
        run: python -m unittest discover -s tests -p 'test_bounded_chunking.py'
      - name: Agent authorization contract tests
        run: python -m unittest discover -s tests -p 'test_agent_access_policy.py'
      - name: Unsafe code execution guard tests
        run: python -m unittest discover -s tests -p 'test_code_execution_guard.py'
      - name: Password hash migration unit tests
        run: python -m unittest discover -s tests -p 'test_password_hash_migration.py'
      - name: Enterprise authorization and UI contract tests
        run: python -m unittest discover -s tests -p 'test_enterprise_boundaries.py'
      - name: Build Docker image
        run: |
          docker build -t huemn-backend:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost/api
        run: npm run build
      - name: Build Docker image
        run: |
          docker build -t huemn-frontend:ci .
